name: Sealed choice parity

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: mtgjson/mtg-sealed-content
          ref: main
          path: sealed-source
          persist-credentials: false
      - name: Record compared revisions
        run: |
          git rev-parse HEAD
          git -C sealed-source rev-parse HEAD
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: uv sync --frozen --extra dev
      - name: Compare live choice compilers
        env:
          SEALED_SOURCE_PATH: ${{ github.workspace }}/sealed-source
        run: uv run pytest tests/mtgjson5/test_sealed_choice_parity.py -v
